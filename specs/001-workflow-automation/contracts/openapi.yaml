openapi: 3.1.0
info:
  title: FlowPilot AI API
  version: 1.0.0
  description: >
    Same-origin REST API for authenticated, creator-owned workspaces.
    All workspace paths enforce owner authorization and database row-level
    security. AI-generated definitions are proposals until validated and saved.
servers:
  - url: /api/v1
security:
  - SessionCookie: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      summary: Check API readiness
      responses:
        '200':
          description: API is ready to accept requests
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/register:
    post:
      operationId: register
      security: []
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /auth/login:
    post:
      operationId: login
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      responses:
        '204':
          description: Session revoked and cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces owned by the current user
      responses:
        '200':
          description: Owned workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWorkspace
      summary: Create a workspace owned by the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    patch:
      operationId: renameWorkspace
      summary: Rename an owned workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '200':
          description: Workspace renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/documents:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listDocuments
      summary: List documents in an owned workspace
      responses:
        '200':
          description: Workspace documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createDocumentUpload
      summary: Create a document record and short-lived private upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '201':
          description: Upload intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadIntent'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /workspaces/{workspaceId}/documents/{documentId}/complete:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: completeDocumentUpload
      summary: Verify and queue validation of an uploaded document
      responses:
        '202':
          description: Document is being validated; it cannot be used until ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DocumentId'
    delete:
      operationId: deleteDocument
      summary: Revoke access and remove source and derived content
      responses:
        '202':
          description: Content access revoked; private object cleanup is queued
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/workflow-proposals:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: generateWorkflowProposal
      summary: Generate a validated workflow proposal from a user description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowProposalRequest'
      responses:
        '200':
          description: Validated proposal for user review; not yet saved or executable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowProposal'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/Unavailable'
  /workspaces/{workspaceId}/workflows:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkflows
      summary: List saved workflows
      responses:
        '200':
          description: Workspace workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createWorkflow
      summary: Save a validated workflow after user review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkflowRequest'
      responses:
        '201':
          description: Workflow saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /workspaces/{workspaceId}/workflows/{workflowId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateWorkflow
      summary: Save a new workflow revision
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Current workflow revision; stale edits receive 409.
          schema:
            type: string
            example: '"workflow-3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkflowRequest'
      responses:
        '200':
          description: Workflow revision saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
    get:
      operationId: getWorkflow
      summary: Get a saved workflow and its current revision
      responses:
        '200':
          description: Saved workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/workflows/{workflowId}/executions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: startExecution
      summary: Confirm and enqueue a workflow execution
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workflowRevision]
              properties:
                workflowRevision:
                  type: integer
                  minimum: 1
                documentId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Execution created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /workspaces/{workspaceId}/executions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listExecutions
      summary: List workspace execution history
      responses:
        '200':
          description: Workspace executions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Execution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/executions/{executionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: executionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getExecution
      summary: Get run state, steps, and sanitized events
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/executions/{executionId}/retry:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: executionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: retryExecutionStep
      summary: Retry one failed step only when its registered action is safe to retry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stepId]
              properties:
                stepId:
                  type: string
      responses:
        '202':
          description: Safe retry queued
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /workspaces/{workspaceId}/approvals/{approvalId}/decision:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: decideApproval
      summary: Approve or reject a pending report replacement
      description: Only the owner of workspaceId may decide; approval atomically verifies the expected report revision before replacing content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
      responses:
        '200':
          description: Decision recorded; report replacement is committed only if the expected revision is current
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '409':
          description: >
            Stale report revision; approval and execution are cancelled and
            the existing report remains unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/approvals/{approvalId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getApproval
      summary: Get owner-authorized approval scope and pending report content
      description: >
        Only the owner of workspaceId may retrieve these details. Proposed
        content is present only while the approval is pending and is never
        included in the approval list response.
      responses:
        '200':
          description: Approval details scoped to the owning workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/approvals:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listApprovals
      summary: List owner-authorized approval summaries without proposed content
      description: Only the owner of workspaceId may list approvals. Retrieve proposed content through the approval detail endpoint.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
      responses:
        '200':
          description: Workspace approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/reports:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listReports
      summary: List generated reports in an owned workspace
      responses:
        '200':
          description: Workspace reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getReport
      summary: Read a report in the owned workspace
      responses:
        '200':
          description: Report content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-flowpilot_session
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidInput:
      description: Request or workflow definition failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication required or credentials invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found in the caller's workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: State, revision, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooLarge:
      description: File exceeds the 20 MB limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: AI provider or required service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    Workspace:
      type: object
      additionalProperties: false
      required: [id, ownerId, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    DocumentUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, mediaType, byteSize]
      properties:
        filename:
          type: string
          maxLength: 255
        mediaType:
          type: string
          enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, text/plain]
        byteSize:
          type: integer
          minimum: 1
          maximum: 20000000
    DocumentUploadIntent:
      type: object
      additionalProperties: false
      required: [document, uploadUrl, expiresAt]
      properties:
        document:
          $ref: '#/components/schemas/Document'
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    Document:
      type: object
      additionalProperties: false
      required: [id, status, filename, mediaType, byteSize, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, validating, ready, failed, deleting]
        filename:
          type: string
        mediaType:
          type: string
        byteSize:
          type: integer
        failureCode:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkflowProposalRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 10000
        documentId:
          type: string
          format: uuid
    WorkflowProposal:
      type: object
      additionalProperties: false
      required: [definition, warnings]
      properties:
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
        warnings:
          type: array
          items:
            type: string
    SaveWorkflowRequest:
      type: object
      additionalProperties: false
      required: [name, definition]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
    Workflow:
      type: object
      additionalProperties: false
      required: [id, name, revision, definition, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        revision:
          type: integer
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
        updatedAt:
          type: string
          format: date-time
    WorkflowDefinition:
      type: object
      additionalProperties: false
      description: >
        A bounded acyclic graph with exactly one root and all nodes reachable
        from that root. Condition nodes have exactly one true and one false
        outgoing edge. The API also enforces workspace ownership and node-kind
        semantics beyond this structural schema.
      required: [version, nodes, edges]
      properties:
        version:
          type: integer
          const: 1
        nodes:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/WorkflowEdge'
    WorkflowNode:
      oneOf:
        - $ref: '#/components/schemas/ExtractDocumentNode'
        - $ref: '#/components/schemas/AnalyzeDocumentNode'
        - $ref: '#/components/schemas/CreateReportNode'
        - $ref: '#/components/schemas/ReplaceReportNode'
        - $ref: '#/components/schemas/ConditionNode'
      discriminator:
        propertyName: kind
    NodeBase:
      type: object
      additionalProperties: false
      required: [id, kind, position, config]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
        position:
          type: object
          additionalProperties: false
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
        config:
          type: object
    ExtractDocumentNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind:
              const: extract_document
            config:
              type: object
              additionalProperties: false
    AnalyzeDocumentNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind:
              const: analyze_document
            config:
              type: object
              additionalProperties: false
              required: [sections]
              properties:
                sections:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [summary, dates, action_items]
    CreateReportNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind:
              const: create_report
            config:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
    ReplaceReportNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind:
              const: replace_report
            config:
              type: object
              additionalProperties: false
              required: [reportId]
              properties:
                reportId:
                  type: string
                  format: uuid
    ConditionNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind:
              const: condition
            config:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [field, operator, value]
                  properties:
                    field:
                      const: has_action_items
                    operator:
                      const: equals
                    value:
                      type: boolean
                - type: object
                  additionalProperties: false
                  required: [field, operator, value]
                  properties:
                    field:
                      const: date_count
                    operator:
                      enum: [equals, greater_than]
                    value:
                      type: integer
                      minimum: 0
    WorkflowEdge:
      type: object
      additionalProperties: false
      description: >
        Branch is present only on edges leaving a condition node and must be
        either true or false. The graph validator rejects duplicate or
        unresolved edges and cycles.
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        branch:
          type: string
          enum: ['true', 'false']
    Execution:
      type: object
      additionalProperties: false
      required: [id, workflowId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, waiting_approval, succeeded, failed, cancelled]
        createdAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            type: object
            required: [stepId, status]
            properties:
              stepId:
                type: string
              status:
                type: string
                enum: [pending, running, waiting_approval, succeeded, failed, skipped]
              errorCode:
                type: string
    Approval:
      type: object
      additionalProperties: false
      required: [id, workspaceId, executionId, actionType, targetReportId, expectedReportRevision, status, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        executionId:
          type: string
          format: uuid
        actionType:
          type: string
          enum: [replace_report]
